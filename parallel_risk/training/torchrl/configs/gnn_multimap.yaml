# Multi-map GNN training — trains a single GNN across the listed maps.
#
# map_names: any subset of the registered maps in
#   parallel_risk/env/map_config.py (currently: simple_6, medium_8, large_10,
#   triangle_6, ring_6, star_8, double_hub_8, hex_grid_10, dense_12).
#   Aliases (e.g. basic_6) should not be listed to avoid double-sampling.
#   Validate any custom set with:
#     python parallel_risk/env/map_config.py
#
# action_budget: single scalar shared across all rollout envs. For a mixed
#   training set with larger maps (e.g. dense_12+), consider bumping this
#   above 5 — the experiments/multi_map_training.py driver auto-computes
#   max(5, max_n // 3) when --action-budget=auto.

env:
  map_names: ["simple_6", "medium_8", "large_10"]
  max_turns: 50
  action_budget: 5
  seed: null
  use_reward_shaping: true

model:
  type: "gcn"
  hidden_dim: 128
  num_layers: 3
  dropout: 0.1

training:
  num_workers: 4
  num_envs: 16             # Envs stepped in lockstep per rollout process; each env draws its
                           # map uniformly from map_names at every reset (see gnn_gcn.yaml)
  rollout_device: "cpu"    # "cuda": collect in-process on the GPU (needs use_gpu: true)
  batch_size: 4096
  num_epochs: 10
  learning_rate: 1.0e-4
  gamma: 0.99
  gae_lambda: 0.95
  clip_epsilon: 0.2
  entropy_coeff: 0.01
  value_loss_coeff: 0.5
  max_grad_norm: 0.5
  use_gpu: false

logging:
  log_dir: "runs/gnn_multimap"
  checkpoint_dir: "checkpoints/gnn_multimap"
  checkpoint_interval: 10
